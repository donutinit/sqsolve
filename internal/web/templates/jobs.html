{{define "content"}}
<div class="pagehead"><h1>Jobs</h1></div>
<section class="card">
  <h2>Running and queued</h2>
  {{if .Data.Active}}{{template "jobtable" .Data.Active}}{{else}}<p class="muted">Nothing running.</p>{{end}}
</section>
<section class="card">
  <div class="cardhead"><h2>History</h2>
    <nav class="tabs small" aria-label="Filter by state">
      <a href="/jobs" {{if eq .Data.State ""}}aria-current="page"{{end}}>All</a>
      <a href="/jobs?state=succeeded" {{if eq .Data.State "succeeded"}}aria-current="page"{{end}}>Succeeded</a>
      <a href="/jobs?state=failed" {{if eq .Data.State "failed"}}aria-current="page"{{end}}>Failed</a>
      <a href="/jobs?state=interrupted" {{if eq .Data.State "interrupted"}}aria-current="page"{{end}}>Interrupted</a>
      <a href="/jobs?state=cancelled" {{if eq .Data.State "cancelled"}}aria-current="page"{{end}}>Cancelled</a>
    </nav>
  </div>
  {{if .Data.History}}{{template "jobtable" .Data.History}}{{else}}<p class="muted">No jobs.</p>{{end}}
</section>
{{end}}
