{{define "content"}}
<section class="card narrow">
  <h1>Confirma que eres tú</h1>
  <p>Esta acción es delicada. Escribe tu contraseña{{if .P.User.TOTPEnabled}} y tu código{{end}} para continuar.</p>
  <form method="post" action="/confirmar" class="form">
    {{template "csrf" .CSRF}}
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label>Contraseña<input type="password" name="password" required autocomplete="current-password" autofocus></label>
    {{if .P.User.TOTPEnabled}}<label>Código<input name="code" required autocomplete="one-time-code" inputmode="numeric" class="mono"></label>{{end}}
    <div class="actions"><button type="submit">Confirmar</button><a href="/">Cancelar</a></div>
  </form>
</section>
{{end}}
