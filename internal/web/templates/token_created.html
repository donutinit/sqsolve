{{define "content"}}
<section class="card narrow">
  <h1>Token created</h1>
  <p>Copy it now: it will not be shown again.</p>
  {{template "copy" (dict "label" "Token" "value" .Data.Token "id" "tok")}}
  <p class="hint">Use it in the header <code>Authorization: Bearer &lt;token&gt;</code>.</p>
  <p><a class="button" href="/account">Done</a></p>
</section>
{{end}}
