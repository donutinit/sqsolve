{{define "content"}}
<section class="card narrow">
  <h1>Sign in</h1>
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf" value="{{.Data.Pre}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label>Username<input name="username" required autocomplete="username" value="{{.Data.User}}" autofocus></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <div class="actions"><button type="submit">Sign in</button></div>
  </form>
  <p class="hint">Lost access? From the container console: <code>sqsolve admin reset-password &lt;username&gt;</code></p>
</section>
{{end}}
