{{define "content"}}
{{$l := .Data.L}}
<section class="card narrow danger-zone">
  <h1>Purge {{$l.DisplayName}}</h1>
  <p>The database in the trash and its users are deleted from the server. This cannot be undone, but the backups are kept and can be used to restore it as a new library.</p>
  <form method="post" action="/libraries/{{$l.ID}}/purge" class="form">
    {{template "csrf" .CSRF}}
    <label>Type <code>{{$l.Slug}}</code> to confirm<input name="confirm" required autocomplete="off" class="mono" data-confirm-match="{{$l.Slug}}"></label>
    <div class="actions"><button type="submit" class="danger" data-needs-match>Purge</button><a href="/libraries/{{$l.ID}}">Cancel</a></div>
  </form>
</section>
{{end}}
