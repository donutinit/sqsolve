{{define "content"}}
<section class="card narrow">
  <h1>Recovery codes</h1>
  <p>The second factor is active. Save these codes: each one works once if you lose the app. They will not be shown again.</p>
  <pre class="codes" id="codes">{{range .Data.Codes}}{{.}}
{{end}}</pre>
  <p><button type="button" class="ghost" data-copy="#codes">Copy</button> <a class="button" href="/account">Done</a></p>
</section>
{{end}}
