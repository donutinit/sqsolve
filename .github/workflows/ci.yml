# SPDX-License-Identifier: AGPL-3.0-only
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # image.yml calls this workflow and publishes only if every job passes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 1.26 is the minimum in go.mod; the image is built with 1.27.
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: PostgreSQL 18 for the integration tests
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18
      - name: Format and vet
        run: make fmt vet
      - name: staticcheck
        run: make lint
      - name: go.mod and go.sum are tidy
        run: make tidy-check
      - name: Every error code has one message
        run: make errors-check
      - name: The PostgreSQL image is the same in the Dockerfile and in deploy/compose.yaml
        run: make pg-image-check
      - name: Tests (including integration tests against real PostgreSQL)
        env:
          SQSOLVE_TEST_PG_BIN: /usr/lib/postgresql/18/bin
          SQSOLVE_REQUIRE_PG: "1"
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: make vuln

  scenarios:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: PostgreSQL 18
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18
      - name: Failure scenarios (simulated workstations, dying processes, PostgreSQL down)
        env:
          SQSOLVE_TEST_PG_BIN: /usr/lib/postgresql/18/bin
          SQSOLVE_SCENARIOS_DIR: ${{ runner.temp }}/scenarios
        run: make scenarios

  smoke:
    runs-on: ubuntu-24.04
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # 1000 is the default; 568 is the "apps" user of TrueNAS.
        uid: ["1000", "568"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT=${GITHUB_SHA::7} -t sqsolve:ci .
      # The binary that ships, not a rebuild from source: same Go toolchain, same modules.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.uid == '1000'
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: govulncheck on the binary inside the image
        if: matrix.uid == '1000'
        run: |
          id=$(docker create sqsolve:ci)
          docker cp "$id:/usr/local/bin/sqsolve" "$RUNNER_TEMP/sqsolve-image-binary"
          docker rm "$id"
          make vuln-binary BINARY="$RUNNER_TEMP/sqsolve-image-binary"
      - name: Prepare the reference compose as is, with temporary paths
        run: |
          mkdir -p "$RUNNER_TEMP/sq"
          sed -e "s#ghcr.io/donutinit/sqsolve:[0-9.]*#sqsolve:ci#" \
              -e "s#/path/to/sqsolve-backups#$RUNNER_TEMP/sq/backups#g" \
              -e "s#/path/to/sqsolve#$RUNNER_TEMP/sq#g" \
              -e "s#SQSOLVE_UID: \"1000\"#SQSOLVE_UID: \"${{ matrix.uid }}\"#" \
              -e "s#SQSOLVE_GID: \"1000\"#SQSOLVE_GID: \"${{ matrix.uid }}\"#" \
              -e "s#user: \"1000:1000\"#user: \"${{ matrix.uid }}:${{ matrix.uid }}\"#" \
              deploy/compose.yaml > "$RUNNER_TEMP/compose.yaml"
          grep -n "sqsolve:ci\|SQSOLVE_UID\|user:" "$RUNNER_TEMP/compose.yaml"
          docker compose -f "$RUNNER_TEMP/compose.yaml" up -d
      - name: Full walkthrough against the image
        run: python3 test/compose_e2e.py "$RUNNER_TEMP/compose.yaml" "$RUNNER_TEMP/sq"
      - name: Logs if something failed
        if: failure()
        run: docker compose -f "$RUNNER_TEMP/compose.yaml" logs
