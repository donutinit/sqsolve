# SPDX-License-Identifier: AGPL-3.0-only
# sqsolve: servidor libre de bibliotecas de proyectos de DaVinci Resolve.
#
# Este mismo archivo sirve en cualquier Linux con Docker Compose y en NAS que aceptan
# Compose (TrueNAS: Apps > Discover > Custom App > Install via YAML; Portainer; Unraid).
#
# Antes de instalar cambia solo esto:
#   1. Las tres rutas de "Volúmenes" (abajo). Respaldos idealmente en otro disco.
#   2. TZ, tu zona horaria.
#   3. Si el puerto 5432 ya está ocupado en el host (Synology), publícalo en la IP de la LAN:
#      "192.168.1.10:5432:5432".
#
# El código de instalación aparece en el registro del contenedor sqsolve.

name: sqsolve

# "1.0" recibe cada arreglo de la serie 1.0 (en TrueNAS aparece "Update available").
# Para dejar una versión exacta, usa por ejemplo "1.0.0".
x-sqsolve: &sqsolve-image "ghcr.io/donutinit/sqsolve:1.0"
x-postgres: &postgres-image "postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336"

x-env: &env
  TZ: "America/Mexico_City"
  SQSOLVE_UID: "1000"
  SQSOLVE_GID: "1000"

services:
  # Prepara volúmenes, secretos y la configuración de PostgreSQL. Corre una vez por arranque.
  sqsolve-init:
    image: *sqsolve-image
    command: ["init"]
    user: "0:0"
    network_mode: none
    environment: *env
    volumes:
      - /ruta/sqsolve/db:/var/lib/postgresql          # Volúmenes: base de datos (SSD)
      - /ruta/sqsolve/app:/var/lib/sqsolve            # Volúmenes: aplicación (SSD)
      - /ruta/sqsolve-respaldos:/backups              # Volúmenes: respaldos (otro disco)
    restart: "no"

  postgres:
    image: *postgres-image
    # Como en las apps de TrueNAS: sqsolve-init le prepara la carpeta de datos y PostgreSQL corre
    # con su propio usuario, nunca como root.
    user: "999:999"
    command: ["postgres", "-c", "config_file=/var/lib/postgresql/sqsolve/postgresql.conf"]
    environment:
      TZ: "America/Mexico_City"
      POSTGRES_PASSWORD_FILE: /var/lib/postgresql/sqsolve/superuser_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8"
    volumes:
      - /ruta/sqsolve/db:/var/lib/postgresql
      - sqsolve-run:/var/run/postgresql
    ports:
      - "5432:5432"
    shm_size: 256mb
    depends_on:
      sqsolve-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/var/run/postgresql"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    restart: unless-stopped

  sqsolve:
    image: *sqsolve-image
    command: ["serve"]
    user: "1000:1000"
    environment:
      <<: *env
      SQSOLVE_LISTEN: ":9432"
    volumes:
      - /ruta/sqsolve/db:/var/lib/postgresql
      - /ruta/sqsolve/app:/var/lib/sqsolve
      - /ruta/sqsolve-respaldos:/backups
      - sqsolve-run:/var/run/postgresql
    ports:
      - "9432:9432"
    depends_on:
      sqsolve-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 120s
    restart: unless-stopped

volumes:
  # Solo el socket de PostgreSQL; no guarda datos.
  sqsolve-run:
