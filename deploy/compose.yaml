# SPDX-License-Identifier: AGPL-3.0-only
# sqsolve: free server for DaVinci Resolve project libraries.
#
# This same file works on any Linux with Docker Compose and on NAS devices that accept
# Compose (TrueNAS: Apps > Discover > Custom App > Install via YAML; Portainer; Unraid).
#
# Before installing, change only this:
#   1. The three "Volumes" paths (below). Backups ideally on another disk.
#   2. TZ, your time zone.
#   3. If port 5432 is already in use on the host (Synology), publish it on the LAN IP:
#      "192.168.1.10:5432:5432".
#
# The installation code appears in the sqsolve container log.

name: sqsolve

# "1.1" receives every fix of the 1.1 series (TrueNAS shows "Update available").
# To pin an exact version, use for example "1.1.0".
x-sqsolve: &sqsolve-image "ghcr.io/donutinit/sqsolve:1.1"

x-env: &env
  TZ: "America/Mexico_City"
  SQSOLVE_UID: "1000"
  SQSOLVE_GID: "1000"

# Container logs rotate: at most 5 files of 10 MB per service. Without a limit Docker keeps
# them forever and a busy server slowly fills the disk of the container runtime.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Prepares volumes, secrets and the PostgreSQL configuration. Runs once per start.
  sqsolve-init:
    image: *sqsolve-image
    command: ["init"]
    user: "0:0"
    network_mode: none
    environment: *env
    logging: *logging
    volumes:
      - /path/to/sqsolve/db:/var/lib/postgresql          # Volumes: database (SSD)
      - /path/to/sqsolve/app:/var/lib/sqsolve            # Volumes: application (SSD)
      - /path/to/sqsolve-backups:/backups              # Volumes: backups (other disk)
    restart: "no"

  postgres:
    # Pinned by digest. A new sqsolve release does not change this line: when the release
    # notes announce a new PostgreSQL minor version, paste the new compose file or replace
    # only this line with the one from the release (docs/manual/user-guide.md, "Updating").
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    # As in TrueNAS apps: sqsolve-init prepares the data folder and PostgreSQL runs
    # with its own user, never as root.
    user: "999:999"
    command: ["postgres", "-c", "config_file=/var/lib/postgresql/sqsolve/postgresql.conf"]
    environment:
      TZ: "America/Mexico_City"
      POSTGRES_PASSWORD_FILE: /var/lib/postgresql/sqsolve/superuser_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8"
    volumes:
      - /path/to/sqsolve/db:/var/lib/postgresql
      - sqsolve-run:/var/run/postgresql
    ports:
      - "5432:5432"
    shm_size: 256mb
    logging: *logging
    depends_on:
      sqsolve-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/var/run/postgresql"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    restart: unless-stopped

  sqsolve:
    image: *sqsolve-image
    command: ["serve"]
    user: "1000:1000"
    environment:
      <<: *env
      SQSOLVE_LISTEN: ":9432"
    volumes:
      - /path/to/sqsolve/db:/var/lib/postgresql
      - /path/to/sqsolve/app:/var/lib/sqsolve
      - /path/to/sqsolve-backups:/backups
      - sqsolve-run:/var/run/postgresql
    ports:
      - "9432:9432"
    depends_on:
      sqsolve-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # A minimal init process as PID 1 reaps orphaned child processes (pg_dump, pg_restore)
    # and passes the stop signal on to sqsolve.
    init: true
    logging: *logging
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 120s
    restart: unless-stopped

volumes:
  # Only the PostgreSQL socket; it stores no data.
  sqsolve-run:
